<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c36">
<title>Cek Dampak Asap Karhutla | Skrining Kesehatan</title>
<meta name="description" content="Skrining mandiri gejala dan faktor risiko paparan asap karhutla. Bukan alat diagnosis.">
<style>
:root{--ink:#17332f;--muted:#5e716d;--green:#176b58;--pale:#edf7f2;--line:#d8e5df;--red:#a92727;--redbg:#fff0ee;--amber:#8a5700;--amberbg:#fff6df;--blue:#194f8a;--bluebg:#edf5ff;--white:#fff;--shadow:0 10px 30px rgba(20,55,45,.08)}
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:850px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#123c36,#24765f);color:#fff;border-radius:22px;padding:28px 24px;margin:8px 0 18px;box-shadow:var(--shadow)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.85}.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.12;margin:.5rem 0}.hero p{margin:.65rem 0 0;max-width:650px;color:#e8f4ef}
.notice{background:#fff9e9;border:1px solid #f0d58a;border-radius:14px;padding:14px 16px;margin:14px 0;color:#614b18}
.progressbox,.panel,.result{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);margin-bottom:8px}.bar{height:7px;background:#e6eeea;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
h2{font-size:1.2rem;margin:0 0 8px}h3{font-size:1rem;margin:18px 0 8px}.sub{color:var(--muted);margin-top:0;font-size:.93rem}
.q{padding:14px 0;border-top:1px solid #edf1ef}.q:first-of-type{border-top:0}.q legend,.question{font-weight:700;display:block;margin-bottom:8px}.choices{display:grid;gap:8px}.choice{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}.choice:has(input:checked){border-color:var(--green);background:var(--pale)}input[type=radio],input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;margin-top:3px;flex:0 0 auto}
.field{width:100%;padding:12px;border:1px solid #bdcec6;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}.field:focus,button:focus{outline:3px solid #a7d7c6;outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#eaf2ee;color:var(--ink);border:1px solid var(--line)}.danger{background:#a92727;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}.result{border-width:2px}.result.red{border-color:#e6a5a0;background:var(--redbg)}.result.amber{border-color:#e8ca80;background:var(--amberbg)}.result.green{border-color:#a8d5be;background:var(--pale)}.result h2{font-size:1.35rem}.tag{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:4px 9px;margin-bottom:8px;background:#fff9}
ul{padding-left:21px}li{margin:.35rem 0}.small{font-size:.85rem;color:var(--muted)}.footer{padding:14px 4px 30px;color:var(--muted);font-size:.84rem}.pill{display:inline-block;background:#eaf2ee;border-radius:999px;padding:4px 9px;font-size:.8rem;margin:3px 3px 3px 0}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.aq{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.aq-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.aq-head h2{margin:0;font-size:1.15rem}.aq-time{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.aq-0{background:#e8f6ec;border-color:#9fd3ae;color:#14532d}.aq-1{background:#fff8d6;border-color:#e6cf62;color:#5c4a00}.aq-2{background:#ffeccf;border-color:#efb46a;color:#7a3e00}.aq-3{background:#ffe1de;border-color:#e59a94;color:#8a1c1c}.aq-4{background:#f1e3f7;border-color:#c79ad8;color:#5b1f73}.aq-5{background:#f3dde3;border-color:#c98a9c;color:#5f1230}
.aq-hero{display:flex;gap:14px;align-items:center;border:2px solid;border-radius:16px;padding:14px;margin-top:12px}
.aq-score{min-width:84px;text-align:center;font-size:2.6rem;font-weight:800;line-height:1}.aq-score small{display:block;font-size:.7rem;font-weight:700;margin-top:4px;opacity:.8}
.aq-label{font-size:1.25rem;font-weight:800;line-height:1.2}.aq-tip{margin:4px 0 0;font-size:.9rem}
.aq-extra{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:.88rem;color:var(--muted)}.aq-chip{background:#f5f8f6;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}.aq-extra details summary{cursor:pointer;text-decoration:underline}
.aq-cmp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.aq-box{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fbfdfc}.aq-box h3{margin:0 0 4px;font-size:.88rem;color:var(--muted)}
